<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temperature Trainer</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #fff; --text: #1d2733; --muted: #6b7785;
    --accent: #2f6fed; --border: #dde3ea;
    --good: #1f9d55; --ok: #d98a00; --bad: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d; --card: #1b232c; --text: #e6ebf0; --muted: #8a97a5;
      --accent: #5b8cff; --border: #2c3743;
      --good: #3ac177; --ok: #f0a92e; --bad: #f06a6a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center; padding: 16px;
  }
  main { width: 100%; max-width: 700px; display: grid; gap: 14px; }
  .play { display: grid; grid-template-columns: 96px minmax(0, 1fr) 96px; gap: 10px; align-items: stretch; }
  .thermo { text-align: center; display: flex; flex-direction: column; align-items: center; }
  .thermo svg { width: 100%; height: auto; max-height: 330px; }
  .thermo .glass { fill: var(--bg); stroke: var(--muted); stroke-width: 2; }
  .thermo .fluid { fill: #e02b2b; }
  .thermo .tick { stroke: var(--muted); stroke-width: 1.5; }
  .thermo .tick.minor { stroke-width: 1; opacity: .6; }
  .thermo text { fill: var(--muted); font-size: 11px; }
  .thermo .actual { stroke: var(--good); stroke-width: 2.5; }
  .thermo .actual-tri { fill: var(--good); }
  .thermo .unit { font-weight: 700; font-size: 1.1rem; }
  .thermo .cap { font-size: .8rem; color: var(--muted); min-height: 2.6em; }
  .thermo .cap b.g { color: var(--good); }
  @media (max-width: 560px) {
    .play { grid-template-columns: 68px minmax(0, 1fr) 68px; gap: 6px; }
    .temp { font-size: 2.4rem !important; }
    input { width: 5.5em !important; }
    .thermo text { font-size: 13px; }
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .formula { text-align: center; }
  .formula .main { font-size: 1.25rem; font-weight: 600; }
  .formula .sub { color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); padding: 10px 14px;
  }
  button.active, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .question { text-align: center; }
  .prompt { color: var(--muted); font-size: .9rem; }
  .temp { font-size: 3.5rem; font-weight: 700; margin: 4px 0 12px; }
  .note { min-height: 1.4em; margin: -8px 0 8px; color: var(--accent); font-weight: 600; font-size: .9rem; }
  .note a { color: inherit; text-decoration: underline dotted; }
  .note a:hover { text-decoration: underline; }
  footer { text-align: center; font-size: .8rem; }
  footer a { color: var(--muted); }
  .answer { display: flex; gap: 8px; justify-content: center; }
  input {
    font: inherit; font-size: 1.4rem; width: 8em; text-align: center; padding: 8px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .result { min-height: 5.5em; margin-top: 12px; }
  .verdict { font-size: 1.3rem; font-weight: 700; }
  .detail { color: var(--muted); }
  .good { color: var(--good); } .ok { color: var(--ok); } .bad { color: var(--bad); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
  .stats b { display: block; font-size: 1.4rem; }
  .stats span { color: var(--muted); font-size: .75rem; }
  .history { display: flex; align-items: flex-end; gap: 3px; height: 60px; margin-top: 12px; }
  .history i { flex: 1; min-height: 3px; border-radius: 2px; background: var(--muted); }
  .history i.good { background: var(--good); } .history i.ok { background: var(--ok); } .history i.bad { background: var(--bad); }
  .foot { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; margin-top: 8px; }
  .foot button { padding: 2px 8px; font-size: .8rem; }
</style>
</head>
<body>
<main>
  <div class="card formula">
    <div class="main" id="formula"></div>
    <div class="sub" id="trick"></div>
  </div>

  <div class="toggle">
    <button id="m-cf" class="active">°C → °F</button>
    <button id="m-fc">°F → °C</button>
  </div>

  <div class="play">
    <div class="thermo" id="th-c"></div>
    <div class="card question">
      <div class="prompt" id="prompt"></div>
      <div class="temp" id="temp"></div>
      <div class="note" id="note"></div>
      <form class="answer" id="form">
        <input id="guess" type="text" inputmode="decimal" autocomplete="off" autofocus>
        <button class="primary" id="go">Check</button>
      </form>
      <div class="result" id="result"></div>
    </div>
    <div class="thermo" id="th-f"></div>
  </div>

  <div class="card">
    <div class="stats">
      <div><b id="s-n">0</b><span>answered</span></div>
      <div><b id="s-avg">–</b><span>avg error</span></div>
      <div><b id="s-close">–</b><span>within 3°</span></div>
      <div><b id="s-streak">0</b><span>streak (≤3°)</span></div>
    </div>
    <div class="history" id="history" title="Recent errors (newest on right)"></div>
    <div class="foot"><span id="mode-label"></span><button id="reset">Reset stats</button></div>
  </div>
  <footer><a href="https://github.com/mampersat/temperature-game" target="_blank" rel="noopener noreferrer">Source on GitHub</a></footer>
</main>

<script>
const W = "https://en.wikipedia.org/wiki/";
// Landmark questions: c / f are the whole-number values asked in each direction; w weights the random pick.
const LANDMARKS = [
  { c: 0,   f: 32,   w: 3, label: "❄ Freezing point of water", url: W + "Melting_point" },
  { c: 100, f: 212,  w: 3, label: "♨ Boiling point of water", url: W + "Boiling_point" },
  { c: 21,  f: 70,   w: 3, label: "🏠 Room temperature", cLabel: "🏠 Room temperature (about 70°F)", url: W + "Room_temperature" },
  { c: 37,  f: 98.6, w: 1, label: "🧍 Human body temperature", url: W + "Human_body_temperature" },
  { c: 74,  f: 165,  w: 1, label: "🍗 Chicken is safe to eat", cLabel: "🍗 Chicken is safe to eat (about 165°F)", url: W + "Food_safety" },
  { c: 4,   f: 40,   w: 1, label: "🧊 Inside a fridge", cLabel: "🧊 Inside a fridge (about 40°F)", url: W + "Refrigerator" },
  { c: 38,  f: 100,  w: 1, label: "☀ A hot day", cLabel: "☀ A hot day (about 100°F)", url: W + "Heat_wave" },
  { c: 54,  f: 130,  w: 1, label: "🥩 Medium-rare steak", cLabel: "🥩 Medium-rare steak (about 130°F)", url: W + "Doneness" },
  { c: 40,  f: 104,  w: 1, label: "🚿 A hot shower", url: W + "Shower" },
];
const marksFor = k => LANDMARKS.map(l => ({ value: l[k], w: l.w, url: l.url, label: (k === "c" && l.cLabel) || l.label }));
const MODES = {
  cf: {
    from: "°C", to: "°F", range: [-25, 45],
    formula: "°F = °C × 9/5 + 32",
    trick: "Shortcut: double it, subtract 10%, add 32 (or just double + 30 for a rough guess)",
    marks: marksFor("c"),
    convert: c => c * 9 / 5 + 32,
  },
  fc: {
    from: "°F", to: "°C", range: [-10, 115],
    formula: "°C = (°F − 32) × 5/9",
    trick: "Shortcut: subtract 30, then halve it (a bit high) — or subtract 32, halve, minus 10%",
    marks: marksFor("f"),
    convert: f => (f - 32) * 5 / 9,
  },
};
const KEY = "temp-trainer-v1";
const $ = id => document.getElementById(id);
const fmt = n => (Math.round(n * 10) / 10).toString().replace("-", "−");

let state = load();
let q = null, answered = false;

// Both thermometers span the same physical range so equal temperatures sit at equal heights.
const THERMO = {
  c: { unit: "°C", min: -30, max: 110, first: -30, step: 10, outer: "left" },
  f: { unit: "°F", min: -22, max: 230, first: -20, step: 20, outer: "right" },
};
const TOP = 20, BOT = 255, CX = 50, BULB_Y = 284, BULB_R = 18, HALF = 8;
const yOf = (k, t) => {
  const s = THERMO[k];
  return TOP + (s.max - Math.min(s.max, Math.max(s.min, t))) / (s.max - s.min) * (BOT - TOP);
};

// level: temperature the fluid rises to (null = empty); actual: temperature of the green marker (or null)
function thermoSvg(k, level, actual, labels = true) {
  const s = THERMO[k], left = s.outer === "left";
  const yb = BULB_Y - Math.sqrt(BULB_R ** 2 - HALF ** 2);
  let g = `<path class="glass" d="M${CX - HALF},${TOP} a${HALF},${HALF} 0 0 1 ${2 * HALF},0 V${yb} ` +
          `A${BULB_R},${BULB_R} 0 1 1 ${CX - HALF},${yb} Z"/>`;
  for (let t = s.first; t <= s.max; t += s.step) {
    for (const [tt, minor] of [[t, false], [t + s.step / 2, true]]) {
      if (tt > s.max) continue;
      const y = yOf(k, tt).toFixed(1);
      const a = left ? CX - HALF - (minor ? 4 : 8) : CX + HALF, b = left ? CX - HALF : CX + HALF + (minor ? 4 : 8);
      g += `<line class="tick${minor ? " minor" : ""}" x1="${a}" x2="${b}" y1="${y}" y2="${y}"/>`;
      if (!minor && labels) g += `<text x="${left ? CX - HALF - 11 : CX + HALF + 11}" y="${+y + 4}" text-anchor="${left ? "end" : "start"}">${String(tt).replace("-", "−")}</text>`;
    }
  }
  if (level != null) {
    const y = yOf(k, level);
    g += `<rect class="fluid" x="${CX - 5}" y="${y.toFixed(1)}" width="10" height="${BULB_Y - y}"/>` +
         `<circle class="fluid" cx="${CX}" cy="${BULB_Y}" r="${BULB_R - 4.5}"/>`;
  }
  if (actual != null) {
    const y = yOf(k, actual).toFixed(1);
    const tri = left ? `${CX + HALF + 2},${y} ${CX + HALF + 13},${y - 6} ${CX + HALF + 13},${+y + 6}`
                     : `${CX - HALF - 2},${y} ${CX - HALF - 13},${y - 6} ${CX - HALF - 13},${+y + 6}`;
    g += `<line class="actual" x1="${CX - HALF - 3}" x2="${CX + HALF + 3}" y1="${y}" y2="${y}"/>` +
         `<polygon class="actual-tri" points="${tri}"/>`;
  }
  return `<svg viewBox="0 0 100 310" role="img" aria-label="${s.unit} thermometer">${g}</svg>`;
}

function drawThermos() {
  const fromK = state.mode === "cf" ? "c" : "f", toK = fromK === "c" ? "f" : "c";
  const levels = { c: null, f: null }, actuals = { c: null, f: null }, caps = { c: "", f: "" };
  levels[fromK] = q.value;
  caps[fromK] = `Given<br><b>${fmt(q.value)}${THERMO[fromK].unit}</b>`;
  if (answered) {
    levels[toK] = q.guess;
    actuals[toK] = q.exact;
    caps[toK] = `You: <b>${fmt(q.guess)}${THERMO[toK].unit}</b><br>Actual: <b class="g">${fmt(q.exact)}${THERMO[toK].unit}</b>`;
  }
  for (const k of ["c", "f"]) {
    $("th-" + k).innerHTML = thermoSvg(k, levels[k], actuals[k], k === fromK || answered) +
      `<div class="unit">${THERMO[k].unit}</div><div class="cap">${caps[k]}</div>`;
  }
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.mode) {
      // older saves kept separate histories per direction; merge them
      if (!Array.isArray(s.history)) s.history = [...(s.history?.cf || []), ...(s.history?.fc || [])];
      return s;
    }
  } catch (e) {}
  return { mode: "cf", history: [] };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function pickWeighted(items) {
  let r = Math.random() * items.reduce((a, i) => a + i.w, 0);
  return items.find(i => (r -= i.w) < 0) || items[items.length - 1];
}

function newQuestion() {
  const m = MODES[state.mode];
  const [lo, hi] = m.range;
  // ~1 in 6 questions is a landmark (see LANDMARKS)
  const mark = Math.random() < 1 / 6 ? pickWeighted(m.marks) : null;
  const value = mark ? mark.value : lo + Math.floor(Math.random() * (hi - lo + 1));
  $("note").innerHTML = mark ? `<a href="${mark.url}" target="_blank" rel="noopener noreferrer">${mark.label}</a>` : "";
  q = { value, exact: m.convert(value) };
  answered = false;
  $("temp").textContent = fmt(value) + m.from;
  $("prompt").textContent = `Convert to ${m.to}`;
  $("guess").value = "";
  $("guess").disabled = false;
  $("go").textContent = "Check";
  $("result").innerHTML = "";
  $("guess").focus();
  drawThermos();
}

function render() {
  const m = MODES[state.mode];
  $("formula").textContent = m.formula;
  $("trick").textContent = m.trick;
  $("m-cf").classList.toggle("active", state.mode === "cf");
  $("m-fc").classList.toggle("active", state.mode === "fc");
  $("mode-label").textContent = "Stats cover both directions";

  const h = state.history;
  $("s-n").textContent = h.length;
  $("s-avg").textContent = h.length ? fmt(h.reduce((a, b) => a + b, 0) / h.length) + "°" : "–";
  $("s-close").textContent = h.length ? Math.round(100 * h.filter(e => e <= 3).length / h.length) + "%" : "–";
  let streak = 0;
  for (let i = h.length - 1; i >= 0 && h[i] <= 3; i--) streak++;
  $("s-streak").textContent = streak;

  const recent = h.slice(-30);
  const max = Math.max(10, ...recent);
  $("history").innerHTML = recent.map(e =>
    `<i class="${cls(e)}" style="height:${Math.max(5, e / max * 100)}%" title="${fmt(e)}° off"></i>`).join("");
}

const cls = e => e <= 1 ? "good" : e <= 3 ? "good" : e <= 6 ? "ok" : "bad";

function check() {
  const guess = parseFloat($("guess").value.replace("−", "-"));
  if (Number.isNaN(guess)) return;
  const m = MODES[state.mode];
  const err = Math.abs(guess - q.exact);
  const signed = guess - q.exact;
  state.history.push(Math.round(err * 10) / 10);
  save();

  let verdict;
  if (err <= 0.5) verdict = "Spot on!";
  else if (err <= 1.5) verdict = "So close!";
  else if (err <= 3) verdict = "Pretty good";
  else if (err <= 6) verdict = "Getting there";
  else verdict = "Way off";

  const dir = signed > 0 ? "too high" : "too low";
  $("result").innerHTML =
    `<div class="verdict ${cls(err)}">${verdict}${err > 0.5 ? ` — ${fmt(err)}° off` : ""}</div>` +
    `<div class="detail">${fmt(q.value)}${m.from} = <b>${fmt(q.exact)}${m.to}</b>` +
    (err > 0.5 ? ` · you were ${dir}` : "") + `</div>`;
  answered = true;
  q.guess = guess;
  drawThermos();
  $("guess").disabled = true;
  $("go").textContent = "Next";
  $("go").focus();
  render();
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  answered ? newQuestion() : check();
});
function setMode(mode) {
  state.mode = mode; save(); render(); newQuestion();
}
$("m-cf").onclick = () => setMode("cf");
$("m-fc").onclick = () => setMode("fc");
$("reset").onclick = () => {
  if (confirm("Reset all stats?")) { state.history = []; save(); render(); }
};

render();
newQuestion();
</script>
</body>
</html>
